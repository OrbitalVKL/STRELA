# Strela APK (lot 5) : à chaque push sur main touchant l'appli, tests, page embarquée, compilation de la coquille
# Android et publication en release « apk-vX.Y.Z » (fichier strela.apk), sur le modèle de Grafit.
# Lot 6 : la release reste l'APK de la variante « github » ; la variante « play » est compilée en Android App Bundle
# (strela-play.aab) signé avec la même clé (future clé d'envoi de Play App Signing), déposé en artefact de compilation,
# jamais publié. Avant publication, le certificat de l'APK est comparé à celui de la release précédente : une autre
# signature empêcherait la mise à jour en place (Android la refuserait).
# Version : package.json (une seule source). Signature : clé chiffrée dans le dépôt (android/signing.p12.enc, AES-256,
# PBKDF2 600 000 tours), générée au premier passage ; seule la phrase de passe, choisie par le propriétaire, est un
# secret GitHub (STRELA_SIGNING_PASSPHRASE). Sans elle : APK de test, non publié (artefact), et un avertissement.
name: apk
on:
  push:
    branches: [main]
    paths: ['index.html', 'manifest.webmanifest', 'assets/**', 'src/**', 'package.json', 'android/**', 'tools/build-site.mjs', 'tools/apk-page.sh', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" > /dev/null
      - name: Playwright (tests de chevauchement et de parcours)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Tests et page embarquée
        run: |
          node tools/build-site.mjs
          node -e "const t=require('./_site/tests.json'); console.log('tests', t.pass + '/' + t.total); if (t.total === null || t.fail) process.exit(1)"
          sh tools/apk-page.sh
          VER=$(node -p "require('./package.json').version")
          echo "VER=$VER" >> "$GITHUB_ENV"
      - name: Clé de signature
        id: ks
        env:
          P: ${{ secrets.STRELA_SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$P" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret STRELA_SIGNING_PASSPHRASE absent : APK de test seulement, non publié (artefact strela-test-apk)"
            echo "### APK de test seulement : le secret STRELA_SIGNING_PASSPHRASE manque, rien n'est publié." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ ! -f android/signing.p12.enc ]; then
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -alias strela -keyalg RSA -keysize 3072 \
              -validity 12000 -storepass "$P" -keypass "$P" -dname "CN=Strela, O=Orbital VKL, C=FR"
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$RUNNER_TEMP/release.jks" -out android/signing.p12.enc -pass env:P
            git config user.name "strela-bot"; git config user.email "strela-bot@users.noreply.github.com"
            git add android/signing.p12.enc
            git commit -m "Clé de signature APK chiffrée [skip ci]"
            git pull --rebase origin main && git push origin HEAD:main
          else
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in android/signing.p12.enc -out "$RUNNER_TEMP/release.jks" -pass env:P
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Compilation (signée)
        if: steps.ks.outputs.signed == 'true'
        working-directory: android
        env:
          KS_FILE: ${{ runner.temp }}/release.jks
          KS_PASS: ${{ secrets.STRELA_SIGNING_PASSPHRASE }}
          KEY_ALIAS: strela
          KEY_PASS: ${{ secrets.STRELA_SIGNING_PASSPHRASE }}
        run: |
          gradle --no-daemon -PstrelaVersion="$VER" assembleGithubRelease bundlePlayRelease
          rm -f "$RUNNER_TEMP/release.jks"
          cp app/build/outputs/apk/github/release/app-github-release.apk ../strela.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab ../strela-play.aab
      - name: Compilation (test, non publiée)
        if: steps.ks.outputs.signed != 'true'
        working-directory: android
        run: gradle --no-daemon -PstrelaVersion="$VER" assembleGithubDebug bundlePlayDebug
      - name: APK de test (artefact)
        if: steps.ks.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: strela-test-apk
          path: |
            android/app/build/outputs/apk/github/debug/app-github-debug.apk
            android/app/build/outputs/bundle/playDebug/app-play-debug.aab
      # Même signature que la version publiée avant (sinon Android refuserait la mise à jour en place) : certificat de
      # strela.apk comparé à celui de la dernière release ; le .aab est signé par la même clé (vérifié aussi).
      - name: Signature identique à la release précédente
        if: steps.ks.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          cert() { "$SIGNER" verify --print-certs "$1" | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}'; }
          NEW=$(cert strela.apk)
          AAB=$(keytool -printcert -jarfile strela-play.aab | grep -m1 "SHA256:" | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "certificat de strela.apk : $NEW ; du .aab : $AAB"
          [ -n "$NEW" ] && [ "$NEW" = "$AAB" ] || { echo "::error::.aab et APK signés par des clés différentes"; exit 1; }
          PREV=$(gh release list --limit 20 --json tagName --jq '.[].tagName' | grep '^apk-v' | grep -vx "apk-v$VER" | head -1 || true)
          if [ -n "$PREV" ] && gh release download "$PREV" --pattern strela.apk --output "$RUNNER_TEMP/prev.apk"; then
            OLD=$(cert "$RUNNER_TEMP/prev.apk")
            echo "certificat de $PREV : $OLD"
            [ "$OLD" = "$NEW" ] || { echo "::error::signature différente de $PREV : la mise à jour en place serait refusée"; exit 1; }
            echo "### Signature identique à $PREV (mise à jour en place possible)" >> "$GITHUB_STEP_SUMMARY"
          fi
      # Variante play : .aab signé, en artefact de compilation seulement (à envoyer à la main sur Google Play).
      - name: Android App Bundle (artefact, jamais publié)
        if: steps.ks.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: strela-play-aab-${{ env.VER }}
          path: strela-play.aab
          retention-days: 90
      - name: Release
        if: steps.ks.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-v$VER"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" strela.apk --clobber
          else
            gh release create "$TAG" strela.apk --title "Strela $VER" --notes "Strela $VER pour Android. Installer strela.apk sur le téléphone ; les versions suivantes s'installent par-dessus depuis l'appli (Réglages › RECHERCHER UNE MISE À JOUR), données gardées."
          fi
          echo "### Publié : release $TAG (strela.apk)" >> "$GITHUB_STEP_SUMMARY"
