# Strela : tests du moteur (node --test) sur chaque demande de fusion et sur main.
# Aucune dépendance à installer : le projet n'utilise que Node.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Tests
        run: node --test --test-reporter=spec
