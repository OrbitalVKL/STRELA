<!doctype html>
<html lang="fr" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rejoindre un salon Strela</title>
<meta name="description" content="Rejoindre une partie de fléchettes en ligne dans Strela.">
<meta name="theme-color" content="#0A0C0E">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/app.css">
<!-- Strela (lot 9.2) : page ouverte par le QR code d'un salon en ligne (https://orbitalvkl.github.io/STRELA/
     rejoindre.html#CODE). Dans Chrome sur Android, OUVRIR DANS L'APPLI passe par le lien strela://rejoindre/CODE
     (filtre d'intention de MainActivity) ; sinon, la version web rejoint le salon (index.html#/enligne/rejoindre/CODE).
     Les liens https n'ouvrent plus une appli non vérifiée depuis Android 12 : d'où ce détour. -->
<style>
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 14px; }
  h1 { font-size: 22px; letter-spacing: 0.1em; margin: 0; }
  .band { background: var(--red); color: var(--red-ink); padding: 12px 16px; font-weight: 800; letter-spacing: 0.2em; }
  .code { font-size: 44px; font-weight: 800; letter-spacing: 0.16em; }
  p { font-size: 14px; line-height: 1.6; margin: 0; }
  small { color: var(--dim); }
</style>
</head>
<body>
<div class="band">STRELA</div>
<main>
  <h1 id="title">Rejoindre un salon</h1>
  <div><small id="what">Code du salon</small><div class="code" id="code">—</div></div>
  <a class="btn accent big" id="app" href="#">OUVRIR DANS L'APPLI STRELA</a>
  <a class="btn big" id="web" href="index.html#/enligne">CONTINUER DANS LE NAVIGATEUR</a>
  <p><small>Sans l'appli : <a href="installer.html">installer Strela</a>. Dans l'appli, on peut aussi taper le code : <span id="where">accueil › EN LIGNE › REJOINDRE</span>.</small></p>
</main>
<script>
  // Code lu après le # : 5 caractères = salon en ligne ; 6 = code d'ami (lot 10). Puis liens vers l'appli et la version web.
  var c = (location.hash || '').slice(1).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
  var friend = c.length === 6;
  var route = friend ? '#/amis/ajouter/' : '#/enligne/rejoindre/';
  if (friend) {
    document.title = 'Strela — ajouter un ami';
    document.getElementById('title').textContent = 'Ajouter un ami';
    document.getElementById('what').textContent = 'Code d\'ami';
    document.getElementById('where').textContent = 'Joueurs › AJOUTER UN AMI';
  }
  if (c) {
    document.getElementById('code').textContent = c;
    document.getElementById('web').href = 'index.html' + route + c;
    document.getElementById('app').href = 'intent://rejoindre/' + c + '#Intent;scheme=strela;package=fr.orbitalvkl.strela;S.browser_fallback_url=' +
      encodeURIComponent(location.href.replace(/rejoindre\.html.*$/, 'index.html' + route + c)) + ';end';
    if (!/Android/i.test(navigator.userAgent)) document.getElementById('app').hidden = true;
  } else document.getElementById('app').hidden = true;
</script>
</body>
</html>
