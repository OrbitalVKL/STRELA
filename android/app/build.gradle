// Strela : coquille Android de la page Strela (WebView sur les fichiers embarqués, voir apk.yml) et passerelle
// « strelaNative » vers ce qu'une WebView ne donne pas bien (vibreur, voix, fichiers, mise à jour).
// Version : une seule source, package.json (champ « version ») ; la tâche GitHub peut la forcer (-PstrelaVersion).
// Signature de la release : variables d'environnement fournies par apk.yml (clé chiffrée dans le dépôt).
// Lot 6 : deux variantes (docs/android.md) :
//   github : fr.orbitalvkl.strela (inchangé : mise à jour en place, données gardées), APK publié en release GitHub,
//            mise à jour intégrée (src/github : Updater, INTERNET, REQUEST_INSTALL_PACKAGES) ;
//   play   : fr.orbitalvkl.strela.play, Android App Bundle (.aab) pour Google Play, sans mise à jour intégrée ni
//            accès réseau (src/play). Les deux peuvent être installées ensemble sur un téléphone.
// Android 16 : compileSdk et targetSdk 36 (bord à bord imposé, retour prédictif par défaut).
plugins { id 'com.android.application' }

def pkg = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def ver = (project.findProperty('strelaVersion') ?: pkg.version).toString()
def code = ver.tokenize('.').collect { it as int }.inject(0) { a, b -> a * 100 + b }

android {
    namespace 'fr.orbitalvkl.strela'
    compileSdk 36
    defaultConfig {
        applicationId 'fr.orbitalvkl.strela'
        minSdk 30
        targetSdk 36
        versionCode code
        versionName ver
    }
    buildFeatures { buildConfig true }   // BuildConfig.FLAVOR (variante, lue par la page) et APPLICATION_ID
    flavorDimensions 'distribution'
    productFlavors {
        github {
            dimension 'distribution'
        }
        play {
            dimension 'distribution'
            applicationId 'fr.orbitalvkl.strela.play'
        }
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KS_FILE') ?: 'release.jks')
            storePassword System.getenv('KS_PASS')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEY_PASS')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
        textReport true      // ci.yml : une API trop récente pour Android 11 (NewApi) fait échouer la CI
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
